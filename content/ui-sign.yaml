email:
  verify_subject: Ověř svůj podpis – Občanský kompas
  verify_body: |-
    Ahoj,

    díky za podpis v Občanském kompasu. Ověř ho tímhle odkazem (platí 7 dní):

    {url}

    Pokud jsi nic nepodepisoval/a, e-mail ignoruj – bez ověření se podpis nezapočítá.
  edit_subject: Odkaz pro úpravu podpisu – Občanský kompas
  edit_body: |-
    Ahoj,

    tímhle odkazem upravíš odpovědi nebo odvoláš podpis (platí 24 hodin a jen jednou):

    {url}

    Pokud jsi o odkaz nežádal/a, e-mail ignoruj.
  report_subject: "Hlášení komentáře: {uuid}"
  report_body: |-
    Hlášení obsahu komentáře na osobní stránce.

    Stránka: {url}
    Důvod: {reason}
    Kontakt oznamovatele: {contact}
