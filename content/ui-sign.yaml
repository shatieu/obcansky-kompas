# Texty podpisu, ověření a osobní stránky (SPEC §7, milník 7). Tykání (design system).
# Stejné konvence klíčů jako ui.yaml: title/*_title = nadpis (max. 8 slov),
# lead/*_lead = text pod nadpisem (1 věta, max. 120 znaků), *_button = tlačítko (max. 3 slova).
# Až se soubor přenese do ui.yaml pod klíč `sign`, stačí v lib/sign/texts.ts číst `ui.sign`.

sign:
