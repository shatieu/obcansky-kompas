# Dopis zastupitelstvu mé obce (SPEC §9.2). Struktura a stupně viz poslanec.yaml.
type: obec
version: 2
label: Zastupitelstvo mé obce
positions:
  # Zastupitelstvo nemá pohlaví: všechna oslovení stojí na jedné ustálené formuli
  # „Vážené zastupitelky, vážení zastupitelé“ (žádné dvojice paní/pane).
  osloveni:
    - id: osl-1
      forma: [1]
      delka: [1, 2, 3]
      text: Dobrý den, vážené zastupitelky, vážení zastupitelé,
    - id: osl-2
      forma: [1, 2, 3]
      delka: [1, 2, 3]
      text: Vážené zastupitelky, vážení zastupitelé,
    - id: osl-3
      forma: [3]
      delka: [1, 2, 3]
      text: Vážené zastupitelky, vážení zastupitelé naší obce,

  uvod:
    - id: uvod-1
      forma: [1]
      delka: [1, 2, 3]
      text: >-
        Bydlím v naší obci a píšu kvůli vládnímu návrhu na financování České
        televize a Českého rozhlasu.
    - id: uvod-2
      forma: [1, 2]
      delka: [1, 2]
      text: >-
        Obracím se na zastupitelstvo naší obce s tématem, které se týká všech:
        s financováním České televize a Českého rozhlasu.
    - id: uvod-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: >-
        Obracím se na Vás jako na zvolené zástupce naší obce. Jde mi o financování
        České televize a Českého rozhlasu.
    - id: uvod-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Dovoluji si obrátit se na zastupitelstvo obce ve věci vládního návrhu
        na financování České televize a Českého rozhlasu.
    - id: uvod-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Píšu Vám, protože vládní návrh na financování České televize a Českého
        rozhlasu považuji za zásadní věc, ke které by ani naše obec neměla mlčet.

  prechod:
    - id: pre-1
      forma: [1]
      delka: [1, 2, 3]
      text: Tak to vidím já.
    - id: pre-2
      forma: [1, 2]
      delka: [1, 2]
      text: Takto si financování médií veřejné služby představuji.
    - id: pre-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: Toto je můj názor na to, jak by financování mělo vypadat.
    - id: pre-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Uvedené body shrnují můj postoj k tomu, jak by mělo být financování médií
        veřejné služby upraveno.
    - id: pre-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Na těchto bodech mi opravdu záleží a budu sledovat, jak se k nim
        zastupitelstvo postaví.

  zadost:
    - id: zad-1
      forma: [1]
      delka: [1, 2, 3]
      text: Prosím, projednejte toto téma na zasedání zastupitelstva.
    - id: zad-2
      forma: [1, 2]
      delka: [1, 2]
      text: >-
        Prosím Vás, zařaďte financování médií veřejné služby na program zasedání
        a vyjádřete se k vládnímu návrhu.
    - id: zad-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: >-
        Žádám zastupitelstvo, aby se vládním návrhem zabývalo a přijalo k němu
        usnesení.
    - id: zad-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Dovoluji si zastupitelstvo obce požádat, aby vládní návrh projednalo
        a přijalo k němu stanovisko.
    - id: zad-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Důrazně Vás žádám: projednejte vládní návrh na zasedání zastupitelstva
        a přijměte k němu jasné stanovisko. Hlas obcí by v této debatě neměl
        chybět.

  zaver:
    - id: zav-1
      forma: [1]
      delka: [1, 2, 3]
      text: |-
        Děkuji.
        S pozdravem
    - id: zav-2
      forma: [1, 2]
      delka: [1, 2]
      text: |-
        Děkuji za Váš čas.
        S pozdravem
    - id: zav-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: |-
        Děkuji za pozornost, kterou mému dopisu věnujete.
        S pozdravem
    - id: zav-4
      forma: [3]
      delka: [1, 2, 3]
      text: |-
        Děkuji Vám za pozornost a uvítám Vaši odpověď.
        S úctou
    - id: zav-5
      forma: [1, 2, 3]
      delka: [3]
      text: |-
        Budu sledovat, jak zastupitelstvo rozhodne. Uvítám Vaši odpověď.
        S pozdravem
