# Dopis poslanci / poslankyni za můj kraj (SPEC §9.2).
# Pozice: osloveni → uvod → [věty z podepsaného textu] → prechod → zadost → [blok o projednávání]
#         → [vlastní věta] → zaver → [patička]
# forma: 1 stručná zpráva · 2 běžný dopis · 3 formální dopis
# delka: 1 krátký a zdvořilý · 2 střední · 3 delší a důrazný
# Texty jsou rodově neutrální vůči pisateli (bez minulého času v 1. osobě).
# Vůči adresátovi se řídí jeho pohlavím (data/directories `pohlavi`): text je buď prostý
# (platí pro všechny), nebo má tvary m (muž) / z (žena) / n (pohlaví neznámé, neutrální
# přeformulování). Oslovení osoby má vždy m/z; bez n se při neznámém pohlaví použije
# osloveni_neutralni z _common.yaml. Dvojznačné tvary („nepodepsal/a“, „paní …, pane …“)
# schéma odmítne. `funkce` = řádek pod jménem v adrese.
type: poslanec
version: 2
label: Poslanci za můj kraj
# Funkce do adresy (okénko obálky) podle pohlaví adresáta.
funkce:
  m: poslanec
  z: poslankyně
positions:
  osloveni:
    - id: osl-1
      forma: [1]
      delka: [1, 2, 3]
      text:
        m: Dobrý den, pane poslanče,
        z: Dobrý den, paní poslankyně,
    - id: osl-2
      forma: [1, 2, 3]
      delka: [1, 2, 3]
      text:
        m: Vážený pane poslanče,
        z: Vážená paní poslankyně,
    - id: osl-3
      forma: [3]
      delka: [1, 2, 3]
      text:
        m: Ctěný pane poslanče,
        z: Ctěná paní poslankyně,
    - id: osl-4
      forma: [1, 2]
      delka: [3]
      text:
        m: Pane poslanče,
        z: Paní poslankyně,

  uvod:
    - id: uvod-1
      forma: [1]
      delka: [1, 2, 3]
      text: Píšu Vám kvůli vládnímu návrhu na financování České televize a Českého rozhlasu.
    - id: uvod-2
      forma: [1, 2]
      delka: [1, 2]
      text: >-
        Bydlím ve Vašem kraji a chci Vám krátce napsat, jak vidím financování
        České televize a Českého rozhlasu.
    - id: uvod-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text:
        m: >-
          Obracím se na Vás, protože jste byl zvolen za můj kraj. Jde mi
          o financování České televize a Českého rozhlasu.
        z: >-
          Obracím se na Vás, protože jste byla zvolena za můj kraj. Jde mi
          o financování České televize a Českého rozhlasu.
        n: >-
          Obracím se na Vás, protože v Poslanecké sněmovně zastupujete i můj kraj.
          Jde mi o financování České televize a Českého rozhlasu.
    - id: uvod-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Dovoluji si Vás oslovit ve věci vládního návrhu na financování České
        televize a Českého rozhlasu, neboť v Poslanecké sněmovně zastupujete
        i můj kraj.
    - id: uvod-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Píšu Vám, protože vládní návrh na financování České televize a Českého
        rozhlasu považuji za zásadní věc, ke které nechci mlčet.

  prechod:
    - id: pre-1
      forma: [1]
      delka: [1, 2, 3]
      text: Tak to vidím já.
    - id: pre-2
      forma: [1, 2]
      delka: [1, 2]
      text: Takto si financování médií veřejné služby představuji.
    - id: pre-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: Toto je můj názor na to, jak by financování mělo vypadat.
    - id: pre-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Uvedené body shrnují můj postoj k tomu, jak by mělo být financování médií
        veřejné služby upraveno.
    - id: pre-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Na těchto bodech mi opravdu záleží a budu sledovat, jak se k nim
        postavíte.

  zadost:
    - id: zad-1
      forma: [1]
      delka: [1, 2, 3]
      text: Prosím, nepodpořte vládní návrh v této podobě.
    - id: zad-2
      forma: [1, 2]
      delka: [1, 2]
      text: >-
        Prosím Vás: nepodpořte vládní návrh v současné podobě a zasaďte se o jeho
        úpravu.
    - id: zad-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: >-
        Žádám Vás, aby vládní návrh v této podobě nezískal Váš hlas, a prosím
        o podporu úprav, které odpovídají uvedeným bodům.
    - id: zad-4
      forma: [3]
      delka: [1, 2, 3]
      text: >-
        Dovoluji si Vás proto požádat, aby vládní návrh v předložené podobě
        nezískal při hlasování v Poslanecké sněmovně Vaši podporu.
    - id: zad-5
      forma: [1, 2, 3]
      delka: [3]
      text: >-
        Důrazně Vás žádám: hlasujte proti vládnímu návrhu v této podobě. Pokud se
        bude měnit, prosazujte řešení, které odpovídá uvedeným bodům.

  zaver:
    - id: zav-1
      forma: [1]
      delka: [1, 2, 3]
      text: |-
        Děkuji.
        S pozdravem
    - id: zav-2
      forma: [1, 2]
      delka: [1, 2]
      text: |-
        Děkuji za Váš čas.
        S pozdravem
    - id: zav-3
      forma: [2, 3]
      delka: [1, 2, 3]
      text: |-
        Děkuji za pozornost, kterou mému dopisu věnujete.
        S pozdravem
    - id: zav-4
      forma: [3]
      delka: [1, 2, 3]
      text: |-
        Děkuji Vám za pozornost a uvítám Vaši odpověď.
        S úctou
    - id: zav-5
      forma: [1, 2, 3]
      delka: [3]
      text: |-
        Vaše rozhodnutí budu pozorně sledovat. Uvítám Vaši odpověď.
        S pozdravem
