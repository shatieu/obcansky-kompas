parts:
  - id: uvodni-ustanoveni
    title: Úvodní ustanovení
    items:
      - id: base-predmet
        title: Předmět úpravy
        text: >-
          Tento zákon upravuje financování České televize a Českého rozhlasu
          (dále jen „média veřejné služby“) při plnění veřejné služby v oblasti
          televizního a rozhlasového vysílání podle zákona č. 483/1991 Sb.,
          o České televizi, a zákona č. 484/1991 Sb., o Českém rozhlasu.
      - id: base-ucel
        title: Účel zákona
        text: >-
          Účelem tohoto zákona je zajistit financování médií veřejné služby
          v rozsahu potřebném k plnění veřejné služby a stanovit, z jakých zdrojů
          a podle jakých pravidel se toto financování poskytuje.

  - id: vyse-a-zdroj
    title: Výše a zdroj prostředků
    items:
      - slot: amount
      - slot: source
      - slot: setting

  - id: poplatek
    title: Poplatek
    items:
      - slot: payer
      - slot: exemptions

  - id: podnikatele
    title: Podnikatelé
    items:
      - slot: firms

  - id: zaverecna-ustanoveni
    title: Společná, přechodná a závěrečná ustanovení
    items:
      - id: base-hospodareni
        title: Hospodaření s prostředky
        subsections:
          - text: >-
              Prostředky poskytnuté podle tohoto zákona smějí média veřejné služby
              použít jen k plnění veřejné služby.
          - text: >-
              Média veřejné služby zveřejňují každoročně ve výroční zprávě přehled
              prostředků získaných podle tohoto zákona a způsob jejich použití.
      - id: base-prechodne
        title: Přechodné ustanovení
        text: >-
          Do konce kalendářního roku, v němž tento zákon nabyl účinnosti, se média
          veřejné služby financují podle dosavadních právních předpisů.
      - id: base-zrusovaci
        title: Zrušovací ustanovení
        when:
          q2: answered
        text: >-
          Zákon č. 348/2005 Sb., o rozhlasových a televizních poplatcích a o změně
          některých zákonů, se zrušuje.
      - id: base-ucinnost
        title: Účinnost
        text: >-
          Tento zákon nabývá účinnosti prvním dnem kalendářního roku následujícího
          po dni jeho vyhlášení.
