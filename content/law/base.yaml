# Společný základ samostatného zákona „o financování médií veřejné služby“ (SPEC §10).
# Pracovní návrh. Text není právní rada a neprošel legislativním procesem.
#
# Struktura:
#   parts[]           – hlavy zákona; číslují se (HLAVA I, II…) až po vynechání prázdných.
#   parts[].items[]   – buď pevný paragraf (id, title, text/subsections), nebo { slot: <id> },
#                       na jehož místo se vloží paragrafy modulů s tímto slotem.
# Šablony v textu:
#   {{ref:<slot>}} – „§ N“ prvního paragrafu daného slotu; když slot v zákoně není, „tohoto zákona“.
#   {{nevim}}      – text pro odpověď „Nevím“ (viz placeholder_nevim).
#   {{amount}}     – částka z odpovědi Q1 (např. „9 200 000 000 Kč“).
# Podmínky `when` (u paragrafu, odstavce i písmene): viz lib/law/schema.ts (WhenSchema).
