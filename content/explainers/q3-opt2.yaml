- id: q3-opt2-c3
  claim: Hodnocení dopadů uvádí jako riziko rozpočtového financování možné oslabení nezávislosti kvůli každoročnímu schvalování rozpočtu.
  source_url: https://www.psp.cz/sqw/text/orig2.sqw?idd=277417
