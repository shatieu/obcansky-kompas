id: q2-opt2
text: |
  Poplatek se platí spolu s daní z příjmu, bez zvláštní složenky.
  Ve Švédsku se platí 1 % příjmu, nejvýš asi 1 200 švédských korun ročně, a peníze jdou na zvláštní účet.
  Ve Finsku platí dospělí 2,5 % z příjmu nad hranicí, nejvýš 160 eur ročně.
pro: Vybrané peníze se smějí použít výhradně na ČT a ČRo.
proti: Platí ho každý dospělý s příjmem, i když vysílání nesleduje.
