id: q3
text: |
  Dnes je výše poplatku v zákoně a sama roste, když stoupají ceny.
  Vládní návrh dává do zákona pevnou částku s podobným pravidlem pro růst cen.
  V Německu výši poplatku navrhuje komise nezávislých odborníků.
pro: ''
proti: ''
claims:
- id: q3-c1
  claim: Výši poplatků stanoví zákon a poplatky se zvýší o 6 %, když součet inflace od posledního zvýšení překročí 6 %.
  source_url: https://www.zakonyprolidi.cz/cs/2005-348
  source_title: Zákon č. 348/2005 Sb., o rozhlasových a televizních poplatcích (znění od 1. 1. 2026)
  locator: § 6 odst. 1 a 2
- id: q3-c2
  claim: Vládní návrh stanoví příspěvek pro rok 2027 na 5 741 826 000 Kč pro ČT a 2 065 766 000 Kč pro ČRo.
  source_url: https://www.psp.cz/sqw/text/orig2.sqw?idd=277415
  source_title: Vládní návrh zákona, kterým se mění zákon o České televizi a zákon o Českém rozhlasu a zrušuje zákon o poplatcích (sněmovní tisk 231/0), včetně důvodové zprávy
  locator: Čl. I a Čl. II, nové § 10a odst. 2, str. 1–2
- id: q3-c3
  claim: Podle návrhu se příspěvek zvýší o 10 %, když kumulativní inflace od roku 2026 nebo od posledního zvýšení překročí 10 procentních bodů.
  source_url: https://www.psp.cz/sqw/text/orig2.sqw?idd=277415
  source_title: Vládní návrh zákona, kterým se mění zákon o České televizi a zákon o Českém rozhlasu a zrušuje zákon o poplatcích (sněmovní tisk 231/0), včetně důvodové zprávy
  locator: Čl. I a Čl. II, nové § 10a odst. 3, str. 1–2
- id: q3-c4
  claim: Německou komisi KEF tvoří 16 nezávislých odborníků, které jmenují předsedové zemských vlád na pět let.
  source_url: https://kef-online.de/kommission/mitglieder
  source_title: KEF – Mitglieder
  locator: úvodní odstavec
  quote: 16 unabhängigen Sachverständigen
- id: q3-c5
  claim: Návrh výše poplatku od komise KEF je podkladem pro rozhodnutí zemských vlád a parlamentů.
  source_url: https://kef-online.de/kommission/zur-arbeit-der-kommission
  source_title: KEF – Zur Arbeit der Kommission
  locator: Zur Arbeit der Kommission
  quote: Der Beitragsvorschlag der Kommission ist Grundlage für die Entscheidung
status: draft
human_reviewed: false
