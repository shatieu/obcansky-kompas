id: q4-opt1
text: |
  Jedna domácnost platí jeden poplatek, bez ohledu na počet lidí.
  Tak je to i dnes: domácnost platí 150 Kč za televizi a 55 Kč za rozhlas měsíčně.
  V Německu se platí asi 18 eur měsíčně za každý byt, bez ohledu na počet lidí.
pro: Výběr je jednodušší, protože se platí jednou za byt.
proti: Člověk žijící sám platí stejně jako početná rodina.
claims:
- id: q4-opt1-c1
  claim: Fyzická osoba platí jeden poplatek i při více přijímačích a člověk ve společné domácnosti s plátcem poplatek neplatí.
  source_url: https://www.zakonyprolidi.cz/cs/2005-348
  source_title: Zákon č. 348/2005 Sb., o rozhlasových a televizních poplatcích (znění od 1. 1. 2026)
  locator: § 5 odst. 1 a 2
- id: q4-opt1-c2
  claim: Televizní poplatek činí 150 Kč a rozhlasový poplatek 55 Kč měsíčně.
  source_url: https://www.zakonyprolidi.cz/cs/2005-348
  source_title: Zákon č. 348/2005 Sb., o rozhlasových a televizních poplatcích (znění od 1. 1. 2026)
  locator: § 6 odst. 1
  quote: Měsíční výše rozhlasového poplatku činí 55 Kč
- id: q4-opt1-c3
  claim: V Německu se za každý byt platí rozhlasový příspěvek 18,36 eur měsíčně bez ohledu na počet lidí v bytě.
  source_url: https://www.rundfunkbeitrag.de/
  source_title: ARD ZDF Deutschlandradio Beitragsservice – Rundfunkbeitrag
  locator: úvodní stránka, oddíl pro občany
  quote: Für jede Wohnung wird monatlich ein Rundfunkbeitrag von 18,36 € erhoben
status: draft
human_reviewed: false
