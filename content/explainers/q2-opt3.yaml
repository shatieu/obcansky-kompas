id: q2-opt3
text: |
  Peníze jdou ze státního rozpočtu, ale zákon je chrání před náhlými změnami.
  Pojistkou může být částka pevně na několik let nebo návrh nezávislé komise.
  Evropský akt o svobodě médií doporučuje přidělovat peníze na několik let dopředu.
  Norsko platí NRK ze státního rozpočtu od roku 2020.
pro: Odpadne vybírání poplatků a pro lidi je systém jednodušší.
proti: Peníze přímo od státu mohou zvýšit závislost médií na státu.
