id: q6-opt2
text: |
  Důchodci platí, ale nižší částku než ostatní. Sleva by platila pro všechny důchodce, i pro ty s vysokým důchodem. Ve Finsku se platí i z důchodu, ale jen z části nad asi 15 tisíc eur ročně.
pro: "Důchodci zaplatí méně a zbude jim víc peněz."
proti: "Slevu dostanou i důchodci, kteří mají vysoký příjem."
