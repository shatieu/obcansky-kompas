id: q5-opt3
text: |
  Kdo vydělává víc, platí víc, a žádná horní hranice není. Částka tedy roste s příjmem bez omezení. Finsko i Švédsko, kde se platí podle příjmu, horní hranici mají.
pro: "Lidé s vysokým příjmem přispějí víc než ostatní lidé."
proti: "Lidé s vysokým příjmem zaplatí víc za stejnou službu."
