id: q6
text: |
  Otázka je, jestli mají důchodci platit stejně jako ostatní lidé. Dnešní český zákon nedává výjimku jen kvůli věku. Ve Švédsku i ve Finsku se poplatek platí i z důchodu.
claims:
  - id: q6-c1
    claim: "Výčet osvobození od poplatků v českém zákoně neobsahuje výjimku podle věku ani pro důchodce."
    source_url: "https://www.zakonyprolidi.cz/cs/2005-348"
    source_title: "Zákon č. 348/2005 Sb., o rozhlasových a televizních poplatcích (znění k 1. 1. 2026)"
    locator: "§ 4 odst. 1 a 2 (výčet osvobozených osob)"
  - id: q6-c2
    claim: "Ve Švédsku platí poplatek i důchodci, pokud se jejich příjem daní."
    source_url: "https://skatteverket.se/privat/skatter/arbeteochinkomst/skattetabeller/publicserviceavgift.4.22501d9e166a8cb399f31dd.html"
    source_title: "Skatteverket – Public service-avgift"
    locator: "sekce Vem ska betala avgiften?"
    quote: "även pensionärer och personer med aktivitetsersättning, sjukersättning och a-kassa betalar avgiften"
  - id: q6-c3
    claim: "Ve Finsku se Yle daň platí také z důchodu, a to z části důchodových příjmů nad 15 150 eur."
    source_url: "https://vero.fi/syventavat-vero-ohjeet/ohje-hakusivu/48391/yleisradiovero5/"
    source_title: "Verohallinto – Yleisradiovero, syventävä vero-ohje (VH/6321/00.01.00/2024)"
    locator: "kap. 2.2 Henkilön yleisradioveron määrä"
    quote: "15 150 euroa ylittävistä eläketuloista ja päivärahatuloista"
