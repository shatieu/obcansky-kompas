id: q2
text: |
  Dnes mají ČT a ČRo peníze hlavně z poplatků.
  Platí je ten, kdo má televizi, rádio, počítač nebo mobil.
  Vláda navrhuje poplatky od roku 2027 zrušit a platit ČT a ČRo ze státního rozpočtu.
  V Evropě se používají poplatky, peníze ze státního rozpočtu i smíšené způsoby.
pro: ''
proti: ''
