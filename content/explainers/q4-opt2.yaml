id: q4-opt2
text: |
  Platil by každý dospělý zvlášť, třeba spolu s daní z příjmu.
  Ve Švédsku platí každý dospělý s příjmem, nejvýš asi 1 200 švédských korun ročně.
  Ve Finsku platí dospělí 2,5 % z příjmu nad hranicí, nejvýš 160 eur ročně.
pro: Platba se rozloží na víc lidí, takže na jednoho vychází méně.
proti: Domácnost s více dospělými zaplatí víc než domácnost s jedním.
