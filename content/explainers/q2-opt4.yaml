id: q2-opt4
text: |
  Podle návrhu se poplatky od roku 2027 zruší a ČT a ČRo dostanou peníze ze státního rozpočtu.
  ČT má dostat asi 5,7 miliardy a ČRo asi 2,1 miliardy korun ročně.
  Je to tolik, kolik vybraly na poplatcích v roce 2024.
  Když ceny od posledního zvýšení vzrostou o víc než 10 %, částka stoupne o 10 %.
pro: Lidé a firmy už nebudou muset platit žádný zvláštní poplatek.
proti: ČT a ČRo dostanou asi o pětinu méně než podle rozpočtů 2026.
claims:
- id: q2-opt4-c1
  claim: Vládní návrh ruší zákon o poplatcích s účinností od 1. 1. 2027 a ČT a ČRo dává příspěvek ze státního rozpočtu.
  source_url: https://www.psp.cz/sqw/text/orig2.sqw?idd=277415
  source_title: Vládní návrh zákona, kterým se mění zákon o České televizi a zákon o Českém rozhlasu a zrušuje zákon o poplatcích (sněmovní tisk 231/0), včetně důvodové zprávy
  locator: Čl. I a II (nové § 10a odst. 1), Čl. IV a Čl. V, str. 1–3
- id: q2-opt4-c2
  claim: Vládní návrh stanoví příspěvek pro rok 2027 na 5 741 826 000 Kč pro ČT a 2 065 766 000 Kč pro ČRo.
  source_url: https://www.psp.cz/sqw/text/orig2.sqw?idd=277415
  source_title: Vládní návrh zákona, kterým se mění zákon o České televizi a zákon o Českém rozhlasu a zrušuje zákon o poplatcích (sněmovní tisk 231/0), včetně důvodové zprávy
  locator: Čl. I a Čl. II, nové § 10a odst. 2, str. 1–2
- id: q2-opt4-c3
  claim: Podle návrhu je příspěvek pro rok 2028 a další roky stejný jako v předchozím roce, pokud se nezvýší kvůli inflaci.
