id: q1
text: |
  Podle rozpočtů na rok 2026 mají ČT a ČRo z poplatků dostat asi 9,2 miliardy korun.
  Vládní návrh jim pro rok 2027 dává ze státního rozpočtu asi 7,8 miliardy.
  To je tolik, kolik vybraly na poplatcích v roce 2024.
  V Česku žije asi 8,9 milionu dospělých.
