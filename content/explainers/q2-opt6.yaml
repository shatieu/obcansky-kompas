id: q2-opt6
text: |
  ČT a ČRo by neměly povinný poplatek ani peníze ze státního rozpočtu.
  Lidé by přispívali jen tehdy, když sami chtějí.
  Dnes jsou poplatky hlavním zdrojem peněz ČT a ČRo.
pro: Platí jen ti, kdo chtějí ČT a ČRo podporovat.
proti: Předem nikdo neví, kolik peněz lidé dobrovolně pošlou.
claims:
