id: q8-opt3
text: |
  Firma platí podle zisku, ale jen do určité částky. Tak to funguje ve Finsku. Firma tam platí 140 eur a 0,35 procenta ze zisku nad 50 tisíc eur. Nejvýš zaplatí 3 000 eur ročně a firmy se ziskem pod 50 tisíc eur neplatí.
pro: "Firmy, které vydělávají víc, přispějí víc než ostatní."
proti: "Výpočet je složitější a velké firmy platí jen maximum."
