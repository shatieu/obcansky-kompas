    - { id: CZ032, label: Plzeňský kraj }
    - { id: CZ041, label: Karlovarský kraj }
    - { id: CZ042, label: Ústecký kraj }
    - { id: CZ051, label: Liberecký kraj }
    - { id: CZ052, label: Královéhradecký kraj }
    - { id: CZ053, label: Pardubický kraj }
    - { id: CZ063, label: Kraj Vysočina }
    - { id: CZ064, label: Jihomoravský kraj }
    - { id: CZ071, label: Olomoucký kraj }
    - { id: CZ072, label: Zlínský kraj }
    - { id: CZ080, label: Moravskoslezský kraj }
  age_groups:
    - { id: "18-29", label: "18–29" }
    - { id: "30-44", label: "30–44" }
    - { id: "45-59", label: "45–59" }
