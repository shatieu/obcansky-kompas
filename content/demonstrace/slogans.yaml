# Předvolby sloganů pro online demonstraci (SPEC-demonstrace §3). Max. 40 znaků.
# Patří k bloku „Kde stojíme my“, ne ke kompasu. Bez tykání i vykání.
# `default` = co se v davu ukáže místo vlastního textu, který ještě neprošel kontrolou.
default: nejsou-jedno
presets:
  - id: ruce-pryc
    text: Ruce pryč od médií
  - id: media-nedame
    text: Média nedáme
  - id: nejsou-jedno
    text: Veřejnoprávní média mi nejsou jedno
  - id: nezavisla-media
    text: Za nezávislá veřejná média
  - id: pravda-nema-majitele
    text: Pravda nemá majitele
  - id: ct-cro-patri-nam
    text: ČT a ČRo patří nám všem
  - id: svobodne-zpravy
    text: Svobodné zprávy, svobodná země
  - id: ne-politikum
    text: Veřejná média nejsou hračka politiků
  - id: tady-stojime
    text: Tady stojíme
  - id: verejna-sluzba
    text: Veřejná služba, ne služba vládě

