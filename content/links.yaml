# Stránka /souvisejici „Odkazy a čtení“ (požadavek vlastníka 2026-10-28). Validuje
# lib/content/links-schema.ts (content:build), limity textu hlídá `pnpm lint:content`:
#   title položky = nadpis (max. 8 slov), description = jedna věta, max. 120 znaků.
# Dvě oddělené skupiny:
#   reading     – „K přečtení“: nestranné, faktické zdroje (zákony, návrh, ČT/ČRo, zahraničí).
#                 Odkazuje se na ni z /metodika a z patičky.
#   initiatives – „Související iniciativy“: patří ke kontextu postoje spolku („Kde stojíme my“),
#                 NE ke kompasu. Odkazuje se na ni jen z bloku postoje. Nikdy z kompasu,
#                 vysvětlivek ani statistik (SPEC §1).
# checked_at = den, kdy adresa vrátila 200 (nebo rozumné přesměrování) a obsah odpovídal popisu.
# added_by: owner = vybral vlastník; research = dohledal agent, vlastník má zkontrolovat.

