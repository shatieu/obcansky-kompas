# Texty UI pro /akce (SPEC §9.2) a /v/[uuid]/zakon (SPEC §10).
# Až je jádro sloučí do ui.yaml (klíče `akce` a `zakon`), stačí v components/akce/texts.ts
# přepnout loader na `ui.akce` / `ui.zakon`.
# Konvence jako ui.yaml: title/*_title ≤ 8 slov, lead/*_lead 1 věta ≤ 120 znaků, *_button ≤ 3 slova.
# Tykání v UI; vykání jen v dopisech (content/letters/*.yaml).

