# Texty stránky /fotka (SPEC §9.3). Po sloučení patří do ui.yaml pod klíč `photo`.
# Konvence klíčů jako v ui.yaml (SPEC §4.1, kontroluje lib/photo/ui-text.test.ts):
#   title, *_title  = nadpis, max. 8 slov
