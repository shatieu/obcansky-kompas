method:
  meta_title: Metodika – Občanský kompas
  kicker: Metodika
  title: Jak kompas funguje
  lead: Otázky, věty i zdroje jsou veřejné, tady je vidíš všechny.
  compose_title: Jak vzniká tvůj text
  compose_body: Text k podpisu se skládá podle pevných pravidel, nepíše ho žádná umělá inteligence. Začíná úvodní větou, pak přijde za každou otázku, na kterou odpovíš, tvůj postoj s krátkým zdůvodněním (dvě až tři věty) v pořadí otázek kompasu, a nakonec závěr. Stejné odpovědi dají vždycky stejný text. U otázek s odpovědí Nevím můžeš větu vynechat.
  branching_title: Větvení otázek
  branching_body: Některé odpovědi spolu nejdou dohromady. Když vybereš jednu z nich, další otázka odpadne nebo se u ní některé volby zašedí. Platí tato pravidla.
  branching_when: Když u otázky „{question}“ vybereš „{option}“
  branching_skip: otázka „{question}“ odpadne
  branching_only: u otázky „{question}“ zbude jen „{options}“
  branching_disable: u otázky „{question}“ nejde vybrat „{options}“
  library_title: Knihovna vět
  library_body: Všechny věty, ze kterých se skládá text. Každá má ID a verzi, aby šlo i za rok přesně zrekonstruovat, co kdo podepsal.
  library_version: Verze knihovny {version}
  library_id: ID
  library_ver: Verze
  library_text: Věta
  library_fragment: "Část věty: {text}"
  library_group_frame: Úvod a závěr
  library_group_nevim: Odpověď Nevím
  library_group_q1: "Otázka 1: částka podle pásma"
  library_group_multi: Otázky s více volbami
  library_group_options: Odpovědi
  verify_title: Fakta ověřují AI agenti
  verify_body: Vysvětlivky a čísla píšou i ověřují AI agenti, ne lidé. Ověřovací agent dostane jen tvrzení, odkaz na zdroj a místo ve zdroji, zdroj otevře a řekne ano, ne, nebo navrhne opravu. Nikdy neověřuje tvrzení, které sám napsal. Zvlášť agenti kontrolují nestrannost a srozumitelnost. Vysvětlivka se ukáže, jen když všechna její tvrzení prošla.
  deviation_title: Odchylka od původního plánu
  deviation_body: Plán byl jeden ověřovací agent na každé tvrzení. Kvůli limitu nejvýš pěti souběžných agentů dostal každý ověřovatel dávku tvrzení, která sám nepsal, a pořád bez kontextu rešerše. Přiznáváme to tady otevřeně.
  counts: "Tvrzení: {total} · potvrzeno: {verified} · čeká nebo k opravě: {open}"
  human_title: Lidská kontrola
  human_none: Zatím žádná položka neprošla lidskou kontrolou. Hledáme lidi různých názorů, kteří vysvětlivky projdou.
  human_some: "Lidskou kontrolou prošlo: {items}"
  sources_button: Všechny zdroje
  data_title: Otevřená data a kód
  data_body: Souhrnná čísla jsou ke stažení jako CSV, skupiny pod 10 lidí jsou sloučené. Celý kód webu je veřejný pod licencí AGPL-3.0.
  data_button: Stáhnout CSV
  repo_link: Zdrojový kód na GitHubu
  repo_url: https://github.com/shatieu/obcansky-kompas
  demo_title: Moderace online demonstrace
  demo_body: V davu se nesmí objevit vulgarita, nenávist ani podvržené jméno. Kontrolují se jen texty, které lidé píšou sami, tedy vlastní slogan a křestní jméno. Slogany z nabídky, póza, barva cedule a vzhled panáčka kontrolu nepotřebují.
  demo_script_title: Kontrola textů
  demo_script_body: Každý vlastní slogan a jméno před zveřejněním projde kontrolou. Ta zachytí vulgarity, nenávist, výhrůžky, sexuální obsah, reklamu a podvržená jména. Ostrou kritiku bez urážek kontrola nezastaví, stejně jako slogany opačného názoru. Když text neprojde, ukážeme jen větu, že ho nelze použít.
  demo_reports_title: Nahlášení a ruční zásahy
  demo_reports_body: Každého panáčka jde nahlásit, z jedné IP adresy jednou. Po třech nahlášeních z různých adres se vlastní slogan a jméno skryjí, dokud je nezkontroluje člověk. Každý zásah, ať ho udělá kontrola, nahlášení, nebo člověk, se zapíše do záznamu.

