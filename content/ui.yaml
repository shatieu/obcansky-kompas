# Všechny texty UI (SPEC §3). Nic natvrdo v komponentách. Tykání (design system, README „Voice“);
# vykání jen v dopisech zástupcům (content/letters/*.yaml) a v jejich PDF částech (akce.pdf_*).
# Konvence klíčů kontrolovaná `pnpm lint:content` (SPEC §4.1):
#   title, *_title  = nadpis obrazovky, max. 8 slov
#   lead, *_lead    = text pod nadpisem, max. 1 věta a 120 znaků
#   *_button        = tlačítko, max. 3 slova
# Zástupné symboly ve složených závorkách doplní kód.
# Sekce sign, verify, page, email, photo, akce a zakon čtou jen serverové loadery
# (lib/sign/texts.ts, lib/photo/content.ts, components/akce/load-texts.ts) – do klientského
# content/generated/ui.json se nezapisují (velikost bundlu /kompas).

