privacy:
  meta_title: Soukromí – Občanský kompas
  kicker: Soukromí
  title: Jak zacházíme s tvými údaji
  lead: Odpovědi bez podpisu zůstávají jen v tvém prohlížeči, k nám nic nejde.
  controller_title: Kdo je správce
  # TODO(owner): údaje spolku jako správce osobních údajů.
  controller_body: "TODO(owner): název spolku, IČO, sídlo a kontaktní e-mail pro ochranu osobních údajů."
  data_title: Jaké údaje zpracováváme
  data_body: Když podepíšeš, uložíme tvé jméno, e-mail, volitelně adresu a tvé odpovědi. Odpovědi jsou tvůj politický názor, tedy zvláštní kategorie údajů. Kraj, věk a velikost obce jsou nepovinné a do statistik jdou jen souhrnně. Jméno, e-mail a adresa jsou zašifrované a nikde je nezobrazíme, jméno jen se tvým souhlasem.
  purpose_title: Proč je zpracováváme
  purpose_body: Abychom ověřili, že podpis je skutečný, zveřejnili tvou osobní stránku s textem a počítali souhrnné statistiky. Adresu použijeme jen do dopisů zástupcům, které si sám/sama stáhneš.
  basis_title: Právní základ
  basis_body: Tvůj výslovný souhlas podle čl. 9 odst. 2 písm. a) GDPR (a čl. 6 odst. 1 písm. a) GDPR). Souhlas dáváš samostatným zaškrtnutím před podpisem a můžeš ho kdykoli odvolat.
  processors_title: Kdo nám s tím pomáhá
  processors_lead: Zpracovatelé, kteří údaje zpracovávají jen podle našich pokynů.
  processor_vercel: "Vercel Inc. – provoz webu (hosting)."
  processor_supabase: "Supabase Inc. – databáze, server v EU (Frankfurt)."
  # TODO(owner): doplnit konkrétního poskytovatele e-mailu.
  processor_email: "Poskytovatel e-mailu – rozesílání ověřovacích odkazů (TODO(owner): doplnit)."
  processor_turnstile: "Cloudflare, Inc. (Turnstile) – ochrana formuláře proti robotům."
  processor_plausible: "Plausible Insights OÜ – anonymní návštěvnost bez cookies, jen pokud ji zapneme."
  retention_title: Jak dlouho údaje držíme
  # TODO(owner): rozhodnout dobu uchování (návrh 12 měsíců po skončení projektu).
  retention_body: "TODO(owner): doba uchování. Návrh je 12 měsíců po skončení projektu, pak osobní údaje smažeme a zůstanou jen anonymní souhrnná čísla."
  logs_title: IP adresy a logy
  logs_body: IP adresu neukládáme. Kvůli ochraně proti zneužití z ní počítáme jen jednosměrný otisk s denní solí, který mažeme nejpozději po 7 dnech. Logy neobsahují osobní údaje.
  rights_title: Tvoje práva
  rights_body: Máš právo na přístup ke svým údajům, jejich opravu, výmaz, omezení zpracování a přenositelnost. Souhlas můžeš kdykoli odvolat, dřívější zpracování tím nepřestane být zákonné. Můžeš si stěžovat u Úřadu pro ochranu osobních údajů (uoou.gov.cz).
  how_title: Jak práva uplatnit
  how_body: "Odpovědi upravíš nebo podpis odvoláš přes odkaz, který ti pošleme e-mailem (požádáš o něj na své osobní stránce). Při odvolání smažeme jméno, e-mail i adresu, odpovědi zůstanou jen anonymně ve statistikách. Ostatní žádosti pošli na kontakt správce. TODO(owner): kontaktní e-mail."
  browser_title: Co zůstává v prohlížeči
  browser_body: Rozpracované odpovědi ukládáme jen do úložiště tvého prohlížeče, ne na server. Fotku a dopisy tvoříš taky jen v prohlížeči. Nepoužíváme reklamní ani sledovací cookies.
  demo_title: Online demonstrace
  demo_body: Když se připojíš k online demonstraci, zveřejníme tvůj slogan, pózu, barvu cedule, vzhled panáčka, pořadí a den připojení. Křestní jméno zveřejníme, jen když ho sám/sama vyplníš. Slogan je tvůj politický názor, proto ho zveřejníme jen s tvým výslovným souhlasem podle čl. 9 odst. 2 písm. a) GDPR, který dáváš samostatným zaškrtnutím. Panáček je navázaný na tvůj ověřený podpis, ale e-mail ani celé jméno u něj nikdy neukážeme.
  demo_check_body: Vlastní slogan a jméno projdou kontrolou, než je ostatní uvidí (pravidla popisuje metodika). Dokud kontrola neskončí, ukazujeme v davu výchozí slogan a žádné jméno. Když někdo panáčka nahlásí, uložíme jen jednosměrný otisk IP adresy, aby nešlo hlásit opakovaně.
  demo_withdraw_body: Panáčka upravíš přes svou osobní stránku. Když odvoláš podpis, panáček z davu zmizí i se sloganem a jménem.
  processor_moderation: "Anthropic, PBC – automatická kontrola vlastních sloganů a jmen v online demonstraci. Dostane jen samotný text, nic dalšího."

