# SPEC §14.3 / §15: lint, typy, obsah, testy, build a audit závislostí na každý push a PR.
# Zátěžové testy (load/k6) a e2e proti produkci se tu záměrně NEspouští.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build a testy běží bez DB a bez klíčů (PGlite v testech, statické stránky při buildu).
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm lint:content
      - run: pnpm verify:content
      - run: pnpm test
      - run: pnpm build
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high
